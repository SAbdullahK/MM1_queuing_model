<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queuing Model Calculator</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2733; --muted: #6b7785;
    --accent: #2f6fa8; --accent-dark: #25577f; --border: #dde3ea;
    --ok: #2e7d4f; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d; --card: #1b222b; --text: #e6ebf0; --muted: #94a0ad;
      --accent: #5b9bd5; --accent-dark: #7ab0e0; --border: #2c3642;
      --ok: #5fbf85; --err: #f2867f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px 4px; }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px 24px 32px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 1rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px 10px; font-size: .95rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .radios { display: flex; flex-direction: column; gap: 6px; }
  .radios label { display: flex; gap: 8px; align-items: center; margin: 0; color: var(--text); font-size: .92rem; }
  button { cursor: pointer; font-size: .95rem; border-radius: 6px; padding: 10px 14px; border: 1px solid var(--accent); }
  .primary { background: var(--accent); color: #fff; width: 100%; margin-top: 18px; }
  .primary:hover { background: var(--accent-dark); }
  .secondary { background: transparent; color: var(--accent); width: 100%; margin-top: 8px; }
  #status { margin-top: 14px; font-size: .88rem; min-height: 1.3em; }
  #status.err { color: var(--err); } #status.ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { background: var(--accent); color: #fff; text-align: left; padding: 8px 10px; font-weight: 600; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
  td.num { font-variant-numeric: tabular-nums; font-weight: 600; }
  td.sym { color: var(--muted); }
  .scroll { overflow-x: auto; }
  .empty { color: var(--muted); font-size: .9rem; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">M/M/c Queuing Model Calculator</h1>
  <p>Steady-state analytical results, computed by the C# <code>MMcQueueModel</code> class.</p>
</header>

<main>
  <section class="card">
    <h2>Inputs</h2>

    <label for="servers" style="margin-top:0">Number of servers</label>
    <input id="servers" type="number" min="1" max="50" step="1" value="1">

    <label>Input type</label>
    <div class="radios">
      <label><input type="radio" name="mode" value="rates" checked> Rates (λ and μ)</label>
      <label><input type="radio" name="mode" value="times"> Mean times</label>
    </div>

    <label for="inUnit">Time unit of your inputs</label>
    <select id="inUnit">
      <option value="secs">Seconds</option>
      <option value="mins" selected>Minutes</option>
      <option value="hrs">Hours</option>
    </select>

    <label id="l1" for="a"></label>
    <input id="a" type="text" inputmode="decimal" value="4">
    <label id="l2" for="b"></label>
    <input id="b" type="text" inputmode="decimal" value="5">

    <label for="outUnit">Show results in</label>
    <select id="outUnit">
      <option value="secs">Seconds</option>
      <option value="mins" selected>Minutes</option>
      <option value="hrs">Hours</option>
    </select>

    <button class="primary" id="calc">Calculate</button>
    <button class="secondary" id="reset">Reset</button>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>Performance measures</h2>
    <div class="scroll"><table id="measures">
      <thead><tr><th>Measure</th><th>Symbol</th><th>Value</th><th>Meaning</th></tr></thead>
      <tbody><tr><td colspan="4" class="empty">Enter values and press Calculate.</td></tr></tbody>
    </table></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const f4 = v => Number(v).toFixed(4);
const NAMES = { secs: 'second', mins: 'minute', hrs: 'hour' };
const SHORT = { secs: 'sec', mins: 'min', hrs: 'hr' };

function mode() { return document.querySelector('input[name=mode]:checked').value; }
function servers() {
  const v = Number($('servers').value);
  return Number.isInteger(v) && v >= 1 && v <= 50 ? v : NaN;
}

function updateLabels() {
  const n = NAMES[$('inUnit').value];
  const c = servers() || 1;
  const perServer = c > 1 ? ' per server' : '';
  $('title').textContent = `M/M/${c} Queuing Model Calculator`;
  if (mode() === 'rates') {
    $('l1').textContent = `Arrival rate λ (customers per ${n})`;
    $('l2').textContent = `Service rate μ${perServer} (customers per ${n})`;
  } else {
    $('l1').textContent = `Mean interarrival time (${n}s)`;
    $('l2').textContent = `Mean service time${perServer} (${n}s)`;
  }
}

function setStatus(msg, cls) { const s = $('status'); s.textContent = msg; s.className = cls || ''; }
function parseNum(t) { return Number(String(t).trim().replace(',', '.')); }

function clearResults() {
  $('measures').querySelector('tbody').innerHTML =
    '<tr><td colspan="4" class="empty">Enter values and press Calculate.</td></tr>';
}

function renderMeasures(d, outUnit) {
  const per = '/' + SHORT[outUnit];
  const u = ' ' + outUnit;
  const c = d.servers;
  const one = c === 1;
  const rows = [
    ['Number of servers', 'c', String(c), 'Identical servers sharing one queue'],
    ['Arrival rate', 'λ', f4(d.lambda) + ' ' + per, 'Customers arriving per unit time'],
    ['Service rate' + (one ? '' : ' (per server)'), 'μ', f4(d.mu) + ' ' + per, 'Customers served per unit time' + (one ? '' : ' by one server')],
    ['Utilization', 'ρ', f4(d.rho), one ? 'ρ = λ/μ' : 'ρ = λ/(cμ), utilization of each server'],
    ['Server idle time', '1 − ρ', f4(d.idle), 'Fraction of time each server is idle'],
  ];
  if (!one) {
    rows.push(['Offered load', 'a', f4(d.a), 'a = λ/μ, average number of busy servers']);
    rows.push(['Empty-system probability', 'ρ₀', f4(d.rho0), 'Probability there are no customers in the system']);
  }
  rows.push(
    ['Avg. # in queue', 'Lq', f4(d.lq), 'Expected customers waiting'],
    ['Avg. time in queue', 'Wq', f4(d.wq) + u, 'Time spent waiting only (Lq/λ)'],
    ['Avg. time in system', 'W', f4(d.w) + u, 'Waiting + service time'],
    ['Avg. # in system', 'L', f4(d.l), one ? 'L = λW' : 'L = Lq + a']
  );
  $('measures').querySelector('tbody').innerHTML = rows.map(r =>
    `<tr><td>${r[0]}</td><td class="sym">${r[1]}</td><td class="num">${r[2]}</td><td>${r[3]}</td></tr>`).join('');
}

async function calculate() {
  const a = parseNum($('a').value), b = parseNum($('b').value);
  if (!isFinite(a) || !isFinite(b) || $('a').value.trim() === '' || $('b').value.trim() === '') {
    setStatus('Please enter valid numbers in both fields.', 'err'); return;
  }
  if (!servers()) {
    setStatus('Number of servers must be a whole number from 1 to 50.', 'err'); return;
  }
  try {
    const res = await fetch('/api/queue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: mode(), a, b,
        inUnit: $('inUnit').value, outUnit: $('outUnit').value,
        servers: servers()
      })
    });
    const data = await res.json();
    if (!res.ok) { clearResults(); setStatus(data.error || 'Request failed.', 'err'); return; }
    renderMeasures(data, $('outUnit').value);
    setStatus('System is stable (ρ < 1).', 'ok');
  } catch (e) {
    setStatus('Could not reach the server. Is the app running?', 'err');
  }
}

function resetAll() {
  $('servers').value = '1';
  document.querySelector('input[name=mode][value=rates]').checked = true;
  $('a').value = '4'; $('b').value = '5';
  $('inUnit').value = 'mins'; $('outUnit').value = 'mins';
  updateLabels(); clearResults(); setStatus('');
}

document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', updateLabels));
$('servers').addEventListener('input', () => { updateLabels(); clearResults(); setStatus(''); });
$('inUnit').addEventListener('change', () => { $('outUnit').value = $('inUnit').value; updateLabels(); });
$('calc').addEventListener('click', calculate);
$('reset').addEventListener('click', resetAll);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') calculate(); });
updateLabels();
</script>
</body>
</html>
